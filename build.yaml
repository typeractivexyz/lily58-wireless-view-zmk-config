# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # nice!view displays via the zmk-nice-oled module: `nice_epaper` is a drop-in
  # replacement for the stock `nice_view` shield at the same slot (both require
  # nice_view_header, which nice_view_adapter exposes). Shield order matters —
  # nice_view_adapter must come first. See docs/zmk-nice-oled.md.
  - board: nice_nano_v2
    shield: lily58_left nice_view_adapter nice_epaper
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_epaper
  # Recovery firmware: flash to BOTH halves to wipe pairing/settings, then re-flash normal firmware
  - board: nice_nano_v2
    shield: settings_reset
