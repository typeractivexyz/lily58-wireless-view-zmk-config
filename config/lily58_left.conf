# Central-half-only Kconfig. Merged ON TOP of lily58.conf for the left build only
# (ZMK appends every matching <shield>.conf — unlike overlays, it does NOT stop at the
# first match — and later files win). The right half never sees any of this.

# --- 3 BLE host profiles instead of ZMK's default 5 ---
# ZMK computes host profiles as BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS
# (see app/include/zmk/ble.h). The split central defaults to BT_MAX_PAIRED=6 with
# 1 peripheral = 5 profiles; 4 - 1 = 3. Kept on the left only so the right half stays
# at its own default of 1 paired device (it only ever bonds to the left).
# The keymap exposes exactly &bt BT_SEL 0..2 to match.
# ⚠️ The zmk-nice-oled profile widget does NOT adapt to the profile count (that was the
# stock ZMK widget). Both of its code paths draw a fixed FIVE slots — `profile.c` is a flat
# `for (i = 0; i < 5; i++)` under PROFILE_BIG, and a single fixed sprite without it. So the
# left screen always shows 5 markers; only the first 3 can ever be selected. Cosmetic.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# --- nice!view central screen (zmk-nice-oled) ---
# These symbols only EXIST on a central build: the module's Kconfig wraps them in
# `if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`. Setting them in the shared lily58.conf
# would warn about undefined symbols on the right half, hence they live here.

# ⚠️ READ THIS BEFORE CHANGING ANY POSITION. The module draws on a PORTRAIT canvas that is
# CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH = 68 px wide, then software-rotates it 90° onto the
# 160x68 panel (widgets/util.c rotate_canvas). So any pre-rotation X >= 68 is simply not on
# the screen. Several of the module's own nice_epaper X defaults break that rule — modifiers
# 62, HID indicators 100, Luna 100 — which is exactly what upstream issue #26 reports
# ("my modifiers are sent all the way off the screen, I can only see a sliver"). Every X
# below is therefore set explicitly, not left to the module's default.

# Live modifier indicators — which of Ctrl/Shift/Opt/Cmd are held right now, as real macOS
# glyphs. The single most useful thing this module adds over stock, because it makes the
# homerow mods visible while you hold them.
# The 2x2 box is 2 glyphs of 14 px with 2 px spacing = 30x30 total. Centred: (68-30)/2 = 19.
# At the module's default X of 62 the right column (62+16=78..92) is entirely off-canvas and
# the left column is clipped to 6 of its 14 px.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=19
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=62
# Layout alternatives. These are one Kconfig choice, so also set _FIXED_BOX=n above when
# switching, or which one wins depends on file ordering rather than intent.
#   _FIXED_HOR=y  — one row of 4. Needs 62 px of width, so pair it with CUSTOM_X=3.
#   _FIXED_VER=y  — stacked column of 4. Ignores CUSTOM_X and self-centres at (68-14)/2,
#                   but needs 62 px of HEIGHT, which collides with the profile row at 129.
# Letters (C/S/A/G) instead of glyphs: _FIXED_LETTER=y (and _FIXED_SYMBOL=n).

# ⚠️ WPM is off entirely, on purpose — three separate reasons:
#   1. The speedometer occupies y 43..~90, right where the modifier box has to sit; there is
#      no arrangement that fits both on a 68 px wide canvas without overlap.
#   2. Upstream PR #33: with no canvas WPM visual enabled the module STILL subscribes the
#      whole status screen to zmk_wpm_state_changed, so it redraws and software-rotates the
#      entire canvas about once a second while typing. That competes with key scanning and
#      BLE — the exact class of problem the connection-latency fix in lily58.conf cured.
#   3. Turning the widget off also drops CONFIG_ZMK_WPM and its RAM.
# If it's ever wanted back, note that the epaper branch of wpm.c HARDCODES the label at
# y=103 (DRAW_LABEL_WMP_Y) and never reads WPM_LABEL_CUSTOM_Y — that knob is a no-op here.
CONFIG_NICE_OLED_WIDGET_WPM=n

# ⚠️ Luna the dog and Bongo Cat are off everywhere. Upstream issue #30: on nice_epaper, WPM
# Luna FREEZES while typing whenever the fixed modifier row is enabled — the modifier
# listener redraws and software-rotates the whole canvas on every keypress and starves the
# animation. You get modifiers OR Luna, not both. Modifiers won.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n

# ⚠️ HID indicators (CapsLock) are off because the widget CANNOT render without an
# animation: hid_indicators.c defines HID_HAS_ANIMATION only under _LUNA or _BONGO_CAT, and
# its #else branch does an unconditional lv_label_set_text(label, ""). So =y with both
# animations off draws literally nothing while still forcing CONFIG_ZMK_HID_INDICATORS and
# its RAM. Turning an animation on instead would re-trigger the issue #30 freeze above, and
# its default X of 100 is off-canvas anyway. Not salvageable on this layout.
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n

# Current layer name (reads the keymap's display-name: Base / Lower / Raise).
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Compact profile row. PROFILE_BIG (the module's epaper default) draws five 14 px icons from
# x=18, so the 4th and 5th land past the 68 px edge. The compact path fits in ~35 px.
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=n

# ⚠️ Do not enable RESPONSIVE_BONGO_CAT — it cannot link. Its asset file is commented out
# of the module's CMakeLists and the symbols the widget references (bongo_cat_both1_90 and
# friends) are defined nowhere in the repo. Verified 2026-08-07, unreported upstream.
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# Raw HID (host clock, volume, keyboard layout, macOS weather + Spotify) needs a companion
# daemon running on the Mac and ~1KB more RAM. Off until it's actually wanted.
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
